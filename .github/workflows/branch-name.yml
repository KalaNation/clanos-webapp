name: Branch name

# Feature branches are <type>/<short-description> and target dev; only dev may target main.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-branch-name.mjs
          sparse-checkout-cone-mode: false

      # Branch names come in through env, never interpolated into the script.
      - run: node scripts/check-branch-name.mjs --pr "$HEAD_REF" "$BASE_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
