version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      next-and-react:
        patterns: [next, eslint-config-next, react, react-dom, '@types/react', '@types/react-dom']
      storybook:
        patterns: [storybook, '@storybook/*', eslint-plugin-storybook]
      lint-and-format:
        patterns:
          [
            eslint,
            'eslint-*',
            '@eslint-community/*',
            '@stylistic/*',
            typescript-eslint,
            'prettier*',
          ]
      testing:
        patterns: [vitest, '@vitest/*', '@testing-library/*', '@playwright/test', playwright, jsdom]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; see _docs/adr/0001-stack.md.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
